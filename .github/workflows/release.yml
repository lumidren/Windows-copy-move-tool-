name: Build and release

# Builds every download (Windows installer, Linux .deb and .tar.gz, Android APK).
# - On every push to main that touches the apps: runs the tests and builds all four,
#   so a broken build is caught long before a release.
# - On a version tag (v*): does the same, then attaches the four files to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "android/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Receiver, certificate and pre-flight tests
        run: npm test

  # The arrival overlay rendered at ten screen sizes. Informative: it needs a real
  # desktop session and exact timing, so it does not block a release.
  overlay:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:overlay

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/release/Flingo-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/release/flingo-linux.deb
            desktop/release/flingo-linux.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Android only replaces an installed app with one signed by the same key. With the
      # project's key in the repository secrets (RELEASING.md says how to add it), every
      # release is signed alike and the app can update itself. Without it the build still
      # works, signed with a key that exists only on this runner.
      - name: Fetch the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/flingo.p12"
            echo "FLINGO_KEYSTORE=$RUNNER_TEMP/flingo.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. This APK is signed with a throwaway key, so it cannot update an installed Flingo and no later release can update it."
          fi
      - run: ./gradlew assembleDebug --no-daemon
        env:
          FLINGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk flingo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/flingo.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      # Only needed for the hand-written notes; the downloads come from the jobs above.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*

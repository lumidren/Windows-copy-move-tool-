name: Build and release

# Builds every download (Windows installer, Linux .deb and .tar.gz, Android APK).
# - On every push to main that touches the apps: runs the tests and builds all four,
#   so a broken build is caught long before a release.
# - On a version tag (v*): does the same, then attaches the four files to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "android/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every action is named by the exact commit it was checked at, with its version beside it, so
# that a tag moved by someone else cannot change what runs here.
# Nothing may write to the repository except the one job that publishes a release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Receiver, certificate and pre-flight tests
        run: npm test

  # The arrival overlay rendered at ten screen sizes. Informative: it needs a real
  # desktop session and exact timing, so it does not block a release.
  overlay:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:overlay

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      # The installer is run for real: it has to put "Phone (Flingo)" in Explorer's Send to
      # menu, pointing at the installed program, and the uninstaller has to take it out again.
      - name: Install, check the Send to entry and the fuses, start it, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo\Phone (Flingo).lnk'
          if (Test-Path -LiteralPath $link) { throw "Already there before installing: $link" }
          Start-Process -FilePath 'release\Flingo-Setup.exe' -ArgumentList '/S' -Wait
          # Flingo makes the same shortcut when it starts, so it must not be what made this one.
          if (Get-Process -Name Flingo -ErrorAction SilentlyContinue) { throw 'The silent install started Flingo, so this check proves nothing.' }
          if (-not (Test-Path -LiteralPath $link)) { throw "The installer did not add $link" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          "Send to entry: `"$($shortcut.TargetPath)`" $($shortcut.Arguments)"
          if ($shortcut.Arguments -ne '--send') { throw "Wrong arguments: $($shortcut.Arguments)" }
          if ((Split-Path $shortcut.TargetPath -Leaf) -ne 'Flingo.exe') { throw "Wrong program: $($shortcut.TargetPath)" }
          if (-not (Test-Path -LiteralPath $shortcut.TargetPath)) { throw "It points at a program that is not there: $($shortcut.TargetPath)" }
          # The installed program, as people get it: its fuses are set, it starts with them, and
          # its receiver answers over TLS 1.3 and refuses anything older.
          $exe = $shortcut.TargetPath
          $fuses = (& npx --no-install electron-fuses read --app $exe) -join "`n"
          $fuses
          foreach ($want in 'RunAsNode is Disabled', 'EnableNodeOptionsEnvironmentVariable is Disabled', 'EnableNodeCliInspectArguments is Disabled', 'OnlyLoadAppFromAsar is Enabled', 'EnableEmbeddedAsarIntegrityValidation is Enabled') {
            if ($fuses -notmatch [regex]::Escape($want)) { throw "Fuse not set: $want" }
          }
          # Started with a debugging port, so the next step can look at what its window drew.
          Start-Process -FilePath $exe -ArgumentList '--hidden', '--remote-debugging-port=9222'
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) { Start-Sleep -Milliseconds 500; $up = [bool](Get-NetTCPConnection -LocalPort 47801 -State Listen -ErrorAction SilentlyContinue) }
          if (-not $up) { throw 'The installed Flingo did not start its receiver.' }
          $info = curl.exe -sk --tlsv1.3 https://127.0.0.1:47801/info | ConvertFrom-Json
          "Answered: app=$($info.app) protocol=$($info.version)"
          if ($info.app -ne 'flingo') { throw 'The receiver did not answer as Flingo.' }
          curl.exe -sk --tls-max 1.2 -o NUL https://127.0.0.1:47801/info
          if ($LASTEXITCODE -eq 0) { throw 'The receiver accepted TLS 1.2.' }
          'TLS 1.2 is refused.'
          # A program can answer on the network and still show a blank window.
          node test/installed-smoke.js 9222
          if ($LASTEXITCODE -ne 0) { throw 'The installed Flingo did not draw its window.' }
          Get-Process -Name Flingo -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $dir = Split-Path $shortcut.TargetPath
          Start-Process -FilePath (Join-Path $dir 'Uninstall Flingo.exe') -ArgumentList '/S', "_?=$dir" -Wait
          if (Test-Path -LiteralPath $link) { throw "The uninstaller left $link behind" }
          'The uninstaller removed it again.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: desktop/release/Flingo-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - name: Check the fuses of the Linux build
        run: |
          out="$(npx --no-install electron-fuses read --app release/linux-unpacked/flingo)"
          echo "$out"
          for want in 'RunAsNode is Disabled' 'EnableNodeOptionsEnvironmentVariable is Disabled' 'EnableNodeCliInspectArguments is Disabled' 'OnlyLoadAppFromAsar is Enabled'; do
            echo "$out" | grep -qF "$want" || { echo "::error::Fuse not set: $want"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            desktop/release/flingo-linux.deb
            desktop/release/flingo-linux.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew
      # Android only replaces an installed app with one signed by the same key. With the
      # project's key in the repository secrets (RELEASING.md says how to add it), every
      # release is signed alike and the app can update itself. Without it the build still
      # works, signed with a key that exists only on this runner.
      # The key is fetched only for a release. An ordinary push builds the same app signed with
      # a throwaway key: enough to prove that it builds, and the real key is not on the runner.
      - name: Fetch the signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No ANDROID_KEYSTORE_BASE64 secret. A release signed with a throwaway key could not update an installed Flingo, so none is made. RELEASING.md says how to add the key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/flingo.p12"
          echo "FLINGO_KEYSTORE=$RUNNER_TEMP/flingo.p12" >> "$GITHUB_ENV"
      # Colour contrast of the phone's palette and the rules for what a screen reader is told.
      - run: ./gradlew testDebugUnitTest --no-daemon
      # The release build: the same code as a debug build, but not debuggable, so nobody with
      # a cable can step into the app or read what it keeps (the pairing with the PC).
      - run: ./gradlew assembleRelease --no-daemon
        env:
          FLINGO_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      - run: cp app/build/outputs/apk/release/app-release.apk flingo.apk
      - name: Check that the APK is not debuggable
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          if "$aapt" dump badging flingo.apk | grep -q "application-debuggable"; then echo "::error::The APK is debuggable."; exit 1; fi
          echo "Not debuggable."
      # The same fingerprint in every release means updates will install over each other.
      - name: Show which key signed the APK
        continue-on-error: true
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs flingo.apk | grep "certificate SHA-256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: android/flingo.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only needed for the hand-written notes; the downloads come from the jobs above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*
